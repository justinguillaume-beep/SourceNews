name: Build SourceNews APK
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "android/**"
      - ".github/workflows/android.yml"
permissions:
  contents: write
concurrency:
  group: android-apk
  cancel-in-progress: true
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Install Android SDK
        run: |
          SDK="$HOME/android-sdk"
          mkdir -p "$SDK/cmdline-tools"
          curl -fsSL -o /tmp/cmdtools.zip https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
          rm -rf /tmp/cmdtools
          unzip -q /tmp/cmdtools.zip -d /tmp/cmdtools
          rm -rf "$SDK/cmdline-tools/latest"
          mv /tmp/cmdtools/cmdline-tools "$SDK/cmdline-tools/latest"
          yes | "$SDK/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null
          "$SDK/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0" "platform-tools"
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          echo "sdk.dir=$SDK" > android/local.properties
      - name: Build signed release APK
        working-directory: android
        run: chmod +x gradlew && ./gradlew assembleRelease --no-daemon -PversionCode=${{ github.run_number }}
      - name: Collect APK
        run: |
          APK=$(find android/app/build/outputs/apk/release -name '*.apk' ! -name '*unsigned*' | head -1)
          test -n "$APK"
          cp "$APK" SourceNews.apk
          echo "APK bytes $(stat -c%s SourceNews.apk)"
      - name: Verify APK
        run: |
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          "$BT/aapt" dump badging SourceNews.apk | head -30
          "$BT/apksigner" verify --verbose --print-certs SourceNews.apk
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          NOTES="Personal-use SourceNews app for Android. It opens the live site full screen, with no browser bar. Installing a newer download over the existing app keeps your place because every build uses the same signing key."
          if gh release view android --repo "${{ github.repository }}" >/dev/null 2>&1; then
            gh release upload android SourceNews.apk --clobber --repo "${{ github.repository }}"
            gh release edit android --latest --title "SourceNews Android" --notes "$NOTES" --repo "${{ github.repository }}"
          else
            gh release create android --latest --title "SourceNews Android" --notes "$NOTES" --repo "${{ github.repository }}" SourceNews.apk
          fi
