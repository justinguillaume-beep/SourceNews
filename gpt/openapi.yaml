openapi: 3.1.0
info: {title: FactNews, version: "1.0.0", description: "Multi-outlet news stories reduced to facts, refreshed every 30 minutes."}
servers: [{url: "https://justinguillaume-beep.github.io/SourceNews"}]
paths:
  /stories.json:
    get:
      operationId: getStories
      summary: Current news stories with fact bullets, outlet bias counts, blindspots, and links
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  generated_at: {type: string, format: date-time}
                  story_count: {type: integer}
                  stories:
                    type: array
                    items:
                      type: object
                      properties:
                        id: {type: integer}
                        headline: {type: string}
                        latest_article_at: {type: string, format: date-time}
                        outlets: {type: array, items: {type: string}}
                        outlet_count: {type: integer}
                        left: {type: integer, description: "Outlets rated Left or Lean Left. Each outlet counts once."}
                        center: {type: integer, description: "Outlets rated Center. Each outlet counts once."}
                        right: {type: integer, description: "Outlets rated Right or Lean Right. Each outlet counts once."}
                        left_pct: {type: integer, description: "Percent of covering outlets on the left."}
                        center_pct: {type: integer, description: "Percent of covering outlets in the center."}
                        right_pct: {type: integer, description: "Percent of covering outlets on the right."}
                        blindspot:
                          description: "left or right when that side has 0 outlets or 20% or less and the opposite side has at least 3. null otherwise."
                          anyOf:
                            - {type: string, enum: [left, right]}
                            - {type: "null"}
                        facts:
                          type: array
                          items:
                            type: object
                            properties:
                              text: {type: string}
                              source_count: {type: integer}
                              sources: {type: array, items: {type: string}}
                              single_source: {type: boolean}
                              origin: {type: string, enum: [body, summary], description: "body = read from the article page; summary = RSS headline or description"}
                        articles:
                          type: array
                          items:
                            type: object
                            properties:
                              outlet: {type: string}
                              lean: {type: string}
                              title: {type: string}
                              url: {type: string}
